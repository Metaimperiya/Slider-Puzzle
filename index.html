<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Slider Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        *,
        *:before,
        *:after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --box: min(400px, 85vw);
            --gap: 6px;
            --radius: 6px;
            --scale: 1;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(#121212, #232323);
            font-family: 'Press Start 2P', monospace;
            padding: 20px;
        }

        .holder {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            place-items: center;
            gap: 30px;
            width: 100%;
            max-width: 600px;
        }

        .puzzletext {
            font-family: 'Press Start 2P', monospace;
            display: grid;
            justify-content: center;
            align-items: center;
            grid-template-rows: repeat(2, 1fr);
            color: #ffb3ff;
            -webkit-text-stroke: 1px #ff00aa;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.35);
            text-align: center;
            font-size: clamp(16px, 5vw, 30px);
            margin-top: 10px;
            line-height: 1.6;
            padding: 0 10px;
        }

        .box {
            width: var(--box);
            height: var(--box);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--gap);
            padding: var(--gap);
            border-radius: var(--radius);
            background: linear-gradient(#222, #333);
            border: 2px solid rgba(255, 255, 255, 0.25);
            transform-origin: center;
            transform: scale(var(--scale));
            aspect-ratio: 1/1;
        }

        .piece {
            user-select: none;
            position: relative;
            display: grid;
            place-items: center;
            border-radius: 4px;
            background-image: radial-gradient(transparent, rgba(0, 0, 0, 0.55));
            background-color: lime;
            box-shadow: inset -1px -1px 1px rgba(0, 0, 0, 0.25),
                inset 1px 1px 1px rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            aspect-ratio: 1/1;
            width: 100%;
            height: 100%;
        }

        .piece:after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(255, 255, 255, 0.25);
            opacity: 0;
            transition: opacity 0.15s;
        }

        .piece:hover:after {
            opacity: 1;
        }

        .piece:active {
            transform: scale(0.92);
        }

        .piece span {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            font-family: 'Press Start 2P', monospace;
            color: #ffb3ff;
            -webkit-text-stroke: 1px #ff00aa;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.35);
            font-size: clamp(14px, 3.5vw, 22px);
            padding: 2px;
            text-align: center;
            line-height: 1;
        }

        /* Адаптация */
        @media (max-width: 500px) {
            :root {
                --box: min(360px, 92vw);
                --gap: 4px;
            }
            .piece span {
                font-size: clamp(12px, 3vw, 18px);
            }
        }

        @media (max-width: 400px) {
            :root {
                --box: min(300px, 90vw);
                --gap: 3px;
            }
            .piece span {
                font-size: clamp(10px, 2.5vw, 14px);
                -webkit-text-stroke: 0.5px #ff00aa;
            }
            .puzzletext {
                font-size: clamp(12px, 4vw, 20px);
            }
        }

        @media (max-width: 340px) {
            :root {
                --box: min(240px, 88vw);
                --gap: 2px;
            }
            .piece span {
                font-size: clamp(8px, 2vw, 12px);
            }
        }

        /* Адаптация под планшеты */
        @media (min-width: 768px) and (max-width: 1024px) {
            :root {
                --box: min(450px, 70vw);
            }
        }
    </style>
</head>
<body>

    <div class="holder">
        <div class="puzzletext">
            <span>Slider</span>
            <span>Puzzle</span>
        </div>
        <div class="box" id="box"></div>
    </div>

    <script>
        const box = document.getElementById('box');

        let n = 4;
        let b = [];
        let p = [];
        let won = false;

        const MAX_TILES = 40;
        const MAX_N = Math.floor(Math.sqrt(MAX_TILES + 1));

        const rc = i => ({ r: (i / n) | 0, c: i % n });
        const adj = (a, b) =>
            Math.abs(rc(a).r - rc(b).r) + Math.abs(rc(a).c - rc(b).c) === 1;

        const rects = () =>
            new Map(p.map(x => [x, x.getBoundingClientRect()]));

        function build() {
            box.innerHTML = '';
            p = [];
            b = Array.from({ length: n * n - 1 }, (_, i) => i + 1).concat(null);

            box.style.gridTemplateColumns = `repeat(${n},1fr)`;
            box.style.gridTemplateRows = `repeat(${n},1fr)`;

            for (let v = 1; v < n * n; v++) {
                const d = document.createElement('div');
                d.className = 'piece';
                const s = document.createElement('span');
                s.textContent = v;
                d.appendChild(s);
                d.onclick = () => move(v);
                box.appendChild(d);
                p.push(d);
            }
        }

        function render(a = false) {
            const prev = a ? rects() : null;

            b.forEach((v, i) => {
                if (!v) return;
                const x = p[v - 1];
                x.style.gridRowStart = rc(i).r + 1;
                x.style.gridColumnStart = rc(i).c + 1;
            });

            if (!a) return;

            requestAnimationFrame(() => {
                p.forEach(x => {
                    const o = prev.get(x);
                    const c = x.getBoundingClientRect();
                    const dx = o.left - c.left;
                    const dy = o.top - c.top;
                    if (!dx && !dy) return;
                    x.style.transition = 'none';
                    x.style.transform = `translate(${dx}px,${dy}px)`;
                    requestAnimationFrame(() => {
                        x.style.transition = 'transform 180ms ease';
                        x.style.transform = 'translate(0,0)';
                    });
                });
            });
        }

        function move(v) {
            const i = b.indexOf(v);
            const e = b.indexOf(null);
            if (!adj(i, e)) return;
            [b[i], b[e]] = [b[e], b[i]];
            render(true);
            if (solved()) setTimeout(win, 200);
        }

        function solved() {
            return b.slice(0, -1).every((v, i) => v === i + 1) && b.at(-1) === null;
        }

        function shuffle(k = n * n * 10) {
            while (k--) {
                const e = b.indexOf(null);
                const m = b.map((_, i) => i).filter(i => adj(i, e));
                const r = m[(Math.random() * m.length) | 0];
                [b[r], b[e]] = [b[e], b[r]];
            }
        }

        function win() {
            if (won) return;
            won = true;

            // Визуальный фидбек победы
            p.forEach(el => {
                el.style.background = '#ff00aa';
                el.style.transition = 'background 0.3s';
            });

            setTimeout(() => {
                n = n < MAX_N ? n + 1 : 4;
                won = false;
                build();
                shuffle();
                render();
            }, 900);
        }

        build();
        shuffle();
        render();
    </script>

</body>
</html>
